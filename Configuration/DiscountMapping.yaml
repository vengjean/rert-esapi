# Recovery curves: per-structure discount-by-month mapping.
#
# Schema:
#   recoveryCurves.<Label>.discount:  [d0, d1, d2, ...]   percent (0..100+)
#   recoveryCurves.<Label>.timepoint: [t0, t1, t2, ...]   months
#
# Semantics (implemented by DiscountCalculator):
#   - At month <= timepoint[i] - 0.5, the discount value is values[i].
#   - In the half-month window (timepoint[i] - 0.5, timepoint[i]] the curve
#     linearly interpolates from values[i] to values[i+1] (or to beyondValue
#     when i is the last edge).
#   - Past the last timepoint, the discount is `max(50.0, last value)`.
#
# Note: discount and timepoint arrays may differ in length (see "Other").
# When more discount values are listed than timepoints, the trailing values
# are used as the post-edge target during interpolation.

recoveryCurves:

  Body:
    discount:  [0.0, 10.0, 25.0, 50.0]
    timepoint: [3.0,  6.0, 12.0, 36.0]

