# ReRT structure & constraint definitions.
#
# Constraint sets shipped here represent published clinical guidance:
#   - "Michigan"  Paradis et al. UMichigan re-irradiation EQD2 limits.
#   - "SABR"      Stanford SABR/SBRT EQD2 limits.
#   - "PHYS"      Extra physical-dose metrics (display only — no op/limit).
# Institutions can override or extend these via additional YAML files
# loaded at startup (see Configuration/InstitutionConfig.local.yaml).
#
# Schema:
#   structures.<Label>.alphaBetaRatio: number        (αβ for EQD2)
#   structures.<Label>.aliases:        [string, ...] (case-insensitive,
#                                                    underscores ignored
#                                                    when matching ESAPI ids)
#   structures.<Label>.constraints.<Set>: list of constraint dicts
#       constraint dict keys:
#           metric: Dmax | Mean | V | VolumeSpared
#           dose:   "20Gy" | "2000cGy"   (only for V/VolumeSpared)
#           op:     '<' | '<=' | '>' | '>='
#           limit:  "85Gy" | "40%" | "1000cc"
#       SABR convention: the FIRST entry is treated as the "Michigan-equivalent"
#       display header (rendered, never compared); remaining entries are
#       evaluated. A leading `null` means there's no Michigan equivalent.
#   structures.<Label>.extraMetrics.<Set>: list of {metric, dose} dicts
#       Used by the PHYS branch — just compute & display, never compare.

version: 0.1

defaults:
  alphaBetaRatio: 2.5
  # Ordered priority for picking THE body contour when a patient has
  # multiple candidates aliased to "Body" (e.g. both a Body and a Skin
  # structure). The first name in this list that matches a candidate's
  # ESAPI Id (case-insensitive, underscores ignored) becomes the body
  # contour; remaining candidates are demoted to plain OARs.
  bodyContourPriority: [Body, External, Skin]

structures:

  Body:
    alphaBetaRatio: 2.5
    aliases: [BODY, External, Skin, SKIN]

  Bladder:
    alphaBetaRatio: 2.5
    aliases: [Bladder]
    constraints:
      Michigan:
        - {metric: Dmax, op: '<', limit: 85Gy}
      SABR:
        - {metric: Dmax, op: '<', limit: 102Gy}

  Bowel_Small:
    alphaBetaRatio: 2.5
    aliases: [Bowel_Small, SmallBowel, Small_Bowel, SmallIntestine, Bowel]
    constraints:
      Michigan:
        - {metric: Dmax, op: '<', limit: 54Gy}
      SABR:
        - {metric: Dmax, op: '<', limit: 85.3Gy}

  BrachialPlexus:
    alphaBetaRatio: 2.5
    aliases: [BrachialPlex, BrachialPlexus, Brachial_Plexus]
    constraints:
      Michigan:
        - {metric: Dmax, op: '<', limit: 70Gy}
      SABR:
        - {metric: Dmax, op: '<', limit: 65Gy}

  Brain:
    alphaBetaRatio: 2.5
    aliases: [Brain]

  Brainstem:
    alphaBetaRatio: 2.5
    aliases: [Brainstem]
    constraints:
      Michigan:
        - {metric: Dmax, op: '<', limit: 64Gy}
      SABR:
        - {metric: Dmax, op: '<', limit: 60Gy}

  SpinalCord:
    alphaBetaRatio: 2.5
    aliases: [SpinalCord, Spinal_Cord, SpinalCord_PRV, SpinalCanal, SpinalCanalPRV]
    constraints:
      Michigan:
        - {metric: Dmax, op: '<', limit: 50Gy}
      SABR:
        - {metric: Dmax, op: '<', limit: 50.4Gy}

  Bronchus:
    alphaBetaRatio: 2.5
    aliases: [BronchTree, Bronchus, Bronc]
    constraints:
      Michigan:
        - {metric: Dmax, op: '<', limit: 70Gy}
      SABR:
        - {metric: Dmax, op: '<', limit: 93.3Gy}

  Trachea:
    alphaBetaRatio: 2.5
    aliases: [Trachea]
    constraints:
      Michigan:
        - {metric: Dmax, op: '<', limit: 70Gy}
      SABR:
        - {metric: Dmax, op: '<', limit: 138.9Gy}

  Lung:
    alphaBetaRatio: 2.5
    aliases: [Lungs-GTV, Lung-GTV, Lungs, "Lung R", "Lung L", Lung_R, Lung_L, Lungs-ITV, Lung-ITV]
    constraints:
      Michigan:
        - {metric: VolumeSpared, dose: 16Gy, op: '>', limit: 1000cc}
      SABR:
        # First entry is the Michigan-equivalent header; `null` means there is
        # no Michigan equivalent shown.
        - null
        - {metric: V, dose: 20Gy, op: '<', limit: 40%}
    extraMetrics:
      PHYS:
        - {metric: V, dose: 20Gy}

  Liver:
    alphaBetaRatio: 2.5
    aliases: [Liver-GTV, Liver-PTV, Liver]
    constraints:
      Michigan:
        - {metric: VolumeSpared, dose: 32Gy, op: '>', limit: 700cc}
      SABR:
        - {metric: VolumeSpared, dose: 32Gy, op: '>', limit: 700cc}
        - {metric: Mean, op: '<', limit: 30Gy}
    extraMetrics:
      PHYS:
        - {metric: VolumeSpared, dose: 32Gy}

  Heart:
    alphaBetaRatio: 2.5
    aliases: [Heart]
